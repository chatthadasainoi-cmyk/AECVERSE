<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AEC VERSE — ใบประกาศนียบัตร</title>
<link rel="icon" type="image/png" href="Logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* หน้านี้ตั้งใจให้ "พิมพ์/บันทึกเป็น PDF" ได้สวยจากเบราว์เซอร์โดยตรง
   จึงคุมขนาดเป็น A4 แนวนอน และซ่อนปุ่มทั้งหมดตอนพิมพ์ */
*{box-sizing:border-box;}
body{margin:0;background:#0b0f17;font-family:"Inter",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px 48px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;font-size:12.5px;
  font-weight:700;cursor:pointer;border:1px solid #1c2531;background:#111826;color:#eef2f7;font-family:inherit;}
.btn.primary{background:#22c55e;border-color:#22c55e;color:#04150b;}
.note{color:#657182;font-size:11.5px;text-align:center;max-width:640px;line-height:1.7;}

.cert{
  width:1122px;height:793px;   /* A4 แนวนอนที่ 96dpi */
  max-width:100%;
  background:linear-gradient(160deg,#fdf6e3,#f5e9c8);
  border:14px solid #c9a24a;
  outline:2px solid #8a6d1f;outline-offset:-22px;
  color:#3a2f1a;font-family:"Sora","Inter",sans-serif;text-align:center;
  padding:54px 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 24px 70px rgba(0,0,0,.5);
}
.cert .org{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;letter-spacing:3px;
  font-weight:700;color:#8a6d1f;text-transform:uppercase;}
.cert .org img{width:34px;height:34px;object-fit:contain;}
.cert .title{font-size:48px;font-weight:800;letter-spacing:5px;margin:16px 0 2px;}
.cert .sub{font-size:14px;letter-spacing:5px;color:#7a6a3f;text-transform:uppercase;}
.cert .desc{font-size:14px;color:#7a6a3f;margin-top:30px;}
.cert .name{font-size:38px;font-weight:800;margin:12px 0 4px;border-bottom:2px solid #c9a24a;
  display:inline-block;padding:0 40px 8px;max-width:100%;word-break:break-word;}
.cert .course{font-weight:800;font-size:20px;margin:22px 0 4px;}
.cert .score{font-size:13px;color:#7a6a3f;}
.cert .foot{display:flex;align-items:flex-end;justify-content:space-between;width:100%;margin-top:auto;padding-top:26px;}
.cert .foot .col{font-size:11px;color:#7a6a3f;text-align:center;flex:1;}
.cert .foot .col b{display:block;font-size:13px;color:#3a2f1a;border-top:1px solid #c9a24a;padding-top:6px;margin-top:26px;}
.cert .seal{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#e5c877,#8a6d1f);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff8e1;
  line-height:1.2;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.25);}
.cert .certid{font-size:10px;color:#9a8a5f;letter-spacing:1px;margin-top:14px;}
.watermark{position:absolute;font-size:110px;font-weight:800;color:rgba(201,162,74,.16);
  transform:rotate(-22deg);pointer-events:none;letter-spacing:8px;}
.wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:100%;}

@media print{
  @page{size:A4 landscape;margin:0;}
  body{background:#fff;padding:0;gap:0;}
  .toolbar,.note{display:none !important;}
  .cert{box-shadow:none;width:100%;height:100vh;max-width:none;border-width:10px;}
}
@media (max-width:1180px){
  .cert{height:auto;aspect-ratio:1122/793;padding:32px;}
  .cert .title{font-size:34px;}
  .cert .name{font-size:26px;}
  .cert .course{font-size:16px;}
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="cert" id="cert">
      <div class="watermark" id="wm" style="display:none;"></div>
      <div class="org"><img src="Logo.png" alt="">AEC VERSE</div>
      <div class="title">CERTIFICATE</div>
      <div class="sub">of completion</div>

      <div class="desc">ขอมอบใบประกาศนียบัตรฉบับนี้ให้แก่</div>
      <div class="name" id="cName">—</div>

      <div class="desc">ผู้ผ่านการทดสอบความรู้ด้านความปลอดภัยในหลักสูตร</div>
      <div class="course" id="cCourse">—</div>
      <div class="score" id="cScore"></div>

      <div class="foot">
        <div class="col"><b id="cDate">—</b>วันที่ออกใบประกาศ</div>
        <div class="seal">AEC<br>VERSE</div>
        <div class="col"><b id="cSigner">—</b>ผู้ลงนาม</div>
      </div>
      <div class="certid" id="cId"></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn primary" onclick="window.print()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    <button class="btn" onclick="history.length > 1 ? history.back() : location.href='PublicKnowledge.html'">← กลับ</button>
  </div>
  <div class="note">
    กด "พิมพ์ / บันทึกเป็น PDF" แล้วเลือกปลายทางเป็น <b>Save as PDF</b> เพื่อเก็บไฟล์ไว้
    — แนะนำให้ตั้งค่าขนาดกระดาษเป็น A4 แนวนอน
  </div>

<script>
// ข้อมูลบนใบเซอร์ส่งมาทาง query string จากหน้าผลสอบ
// (ตัวใบเป็นแค่การแสดงผล — การตัดสินว่าผ่านหรือไม่ทำที่ server ไปแล้ว)
const q = new URLSearchParams(location.search);
const txt = (id, v) => { document.getElementById(id).textContent = v; };

txt('cName', q.get('name') || '—');
txt('cCourse', q.get('course') || 'Basic Safety');
txt('cSigner', q.get('signer') || 'Super Administrator');

const score = q.get('score');
txt('cScore', score ? `ด้วยคะแนน ${score}` : '');

const issued = q.get('date') ? new Date(q.get('date')) : new Date();
txt('cDate', isNaN(issued.getTime()) ? '—'
  : issued.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' }));

const id = q.get('id');
txt('cId', id ? 'เลขที่ ' + id : '');

// โหมดดูตัวอย่างของแอดมิน — ประทับ PREVIEW ทับไว้กันเอาไปใช้เป็นใบจริง
if (q.get('preview') === '1') {
  const wm = document.getElementById('wm');
  wm.textContent = 'PREVIEW';
  wm.style.display = 'block';
  document.title = 'ตัวอย่างใบประกาศนียบัตร (PREVIEW)';
}
</script>
</body>
</html>
