<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AEC VERSE — AR</title>
<link rel="icon" type="image/png" href="Logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050b14;
    font-family:"Inter",system-ui,-apple-system,sans-serif;color:#eef2f7;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  canvas{display:block;touch-action:none;}

  /* ---------- แถบหัวเรื่องลอยด้านบน ---------- */
  #ar-top{position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(5,11,20,0.85),rgba(5,11,20,0));
    pointer-events:none;}
  #ar-top img{width:30px;height:30px;object-fit:contain;}
  #ar-top .t{font-family:"Sora",sans-serif;font-weight:800;font-size:14px;letter-spacing:.5px;line-height:1.1;}
  #ar-top .t span{color:#4ade80;}
  #ar-top .s{font-size:10px;color:#9aa7b8;margin-top:2px;
    max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- สถานะ/โหลด ---------- */
  #ar-status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;
    text-align:center;width:min(320px,86vw);pointer-events:none;}
  #ar-status .ring{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;
    border:3px solid #1c2c3f;border-top-color:#3b82f6;border-right-color:#22d3ee;
    animation:spin .85s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #ar-status .msg{font-size:13px;color:#a8b7c7;line-height:1.6;}
  #ar-status .pct{font-size:11.5px;color:#657182;margin-top:6px;}

  /* ---------- ปุ่มล่าง ---------- */
  #ar-actions{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;gap:10px;justify-content:center;
    background:linear-gradient(0deg,rgba(5,11,20,0.9),rgba(5,11,20,0));}
  .ar-btn{flex:1;max-width:230px;padding:14px;border:none;border-radius:12px;
    font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;
    background:linear-gradient(90deg,#3b82f6,#22c55e);color:#04150b;}
  .ar-btn.ghost{background:rgba(20,32,48,0.92);color:#eef2f7;border:1px solid #243347;}
  .ar-btn:disabled{opacity:.5;}

  /* ---------- การ์ดข้อมูลชิ้นส่วนตอนแตะ ---------- */
  #ar-info{position:fixed;left:12px;right:12px;bottom:0;z-index:30;
    background:rgba(9,15,24,0.96);border:1px solid #1c2c3f;
    border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
    max-height:52vh;overflow-y:auto;box-shadow:0 -14px 40px rgba(0,0,0,.5);}
  #ar-info.open{transform:translateY(0);}
  #ar-info .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  #ar-info .nm{font-size:15px;font-weight:800;font-family:"Sora",sans-serif;line-height:1.3;}
  #ar-info .x{background:none;border:none;color:#657182;font-size:20px;line-height:1;cursor:pointer;padding:2px 4px;}
  #ar-info .desc{font-size:12.5px;color:#a8b7c7;line-height:1.65;}
  #ar-info .steps{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
  #ar-info .step{background:rgba(59,130,246,.10);border-left:3px solid #3b82f6;
    border-radius:0 8px 8px 0;padding:8px 10px;font-size:12px;line-height:1.55;color:#dbe6f2;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;margin-bottom:8px;}
  .tag-blue{background:rgba(56,189,248,.16);color:#7dd3fc;}
  .tag-red{background:rgba(239,68,68,.16);color:#fca5a5;}
  .tag-orange{background:rgba(249,115,22,.16);color:#fdba74;}
  .tag-green{background:rgba(34,197,94,.16);color:#86efac;}

  #ar-hint{position:fixed;left:0;right:0;bottom:96px;z-index:18;text-align:center;
    font-size:11.5px;color:#9aa7b8;pointer-events:none;padding:0 20px;}
</style>
</head>
<body>

<div id="ar-top">
  <img src="Logo.png" alt="">
  <div>
    <div class="t">AEC <span>VERSE</span></div>
    <div class="s" id="ar-model-name">กำลังเตรียมโมเดล...</div>
  </div>
</div>

<div id="ar-status">
  <div class="ring" id="ar-ring"></div>
  <div class="msg" id="ar-msg">กำลังโหลดโมเดล 3 มิติ...</div>
  <div class="pct" id="ar-pct"></div>
</div>

<div id="ar-hint"></div>

<div id="ar-actions" style="display:none;">
  <button class="ar-btn" id="ar-enter">📱 ดูแบบ AR</button>
  <button class="ar-btn ghost" id="ar-reset">รีเซ็ตมุมมอง</button>
</div>

<div id="ar-info">
  <div class="hd">
    <div>
      <span class="tag tag-blue" id="ar-info-tag">ชิ้นส่วน</span>
      <div class="nm" id="ar-info-name">—</div>
    </div>
    <button class="x" id="ar-info-close" aria-label="ปิด">✕</button>
  </div>
  <div class="desc" id="ar-info-desc"></div>
  <div class="steps" id="ar-info-steps"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="ar.js"></script>
</body>
</html>
