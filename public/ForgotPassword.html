<!DOCTYPE html>
  <html lang="th">
  <head>
    <meta charset="UTF-8">
    <title>AEC VERSE — Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <style>
      :root{
          --bg-0:#050b14;
          --bg-1:#0a1420;
          --panel:#0c1826;
          --panel-border:#1c2c3f;
          --field-bg:#0e1b29;
          --field-border:#243347;
          --text-0:#f4f8fb;
          --text-1:#a8b7c7;
          --text-2:#6d7f92;
          --accent-green:#4ade80;
          --accent-blue:#3b82f6;
          --accent-cyan:#22d3ee;
          --danger:#ef4444;
      }

      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
          background:radial-gradient(1200px 800px at 15% 10%, #0d1c2c 0%, var(--bg-0) 55%), var(--bg-0);
          color:var(--text-0);
          font-family:"Inter",system-ui,sans-serif;
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:28px;
      }

      .card{
          width:100%;
          max-width:460px;
          background:linear-gradient(180deg, #0d1c2c 0%, #0a1520 100%);
          border:1px solid #16283b;
          border-radius:16px;
          padding:48px 40px;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      }

      .icon-wrap{
          width:56px;height:56px;
          border-radius:14px;
          background:rgba(34,211,238,0.12);
          color:var(--accent-cyan);
          display:flex;align-items:center;justify-content:center;
          margin-bottom:20px;
      }

      h1{
          font-family:"Sora",sans-serif;
          font-size:26px;
          font-weight:700;
          margin:0 0 8px 0;
      }

      p.sub{
          margin:0 0 8px 0;
          color:var(--text-1);
          font-size:14px;
          line-height:1.6;
      }

      .field{
          margin:24px 0 20px 0;
      }

      .field label{
          display:block;
          font-size:13px;
          font-weight:600;
          color:var(--text-1);
          margin-bottom:8px;
      }

      .field .input-wrap{
          position:relative;
          display:flex;
          align-items:center;
      }

      .field .input-wrap svg.icon-left{
          position:absolute;
          left:16px;
          color:var(--text-2);
          pointer-events:none;
      }

      .field input{
          width:100%;
          background:var(--field-bg);
          border:1px solid var(--field-border);
          border-radius:10px;
          padding:14px 16px 14px 46px;
          color:var(--text-0);
          font-size:14.5px;
          font-family:inherit;
          outline:none;
          transition:border-color .15s ease, box-shadow .15s ease;
      }

      .field input::placeholder{color:#54677b;}
      .field input:focus{
          border-color:var(--accent-cyan);
          box-shadow:0 0 0 3px rgba(34,211,238,0.12);
      }

      .auth-error{
          background:rgba(239,68,68,0.12);
          border:1px solid rgba(239,68,68,0.35);
          color:#fca5a5;
          border-radius:10px;
          padding:10px 14px;
          font-size:13px;
          margin-bottom:16px;
      }

      .auth-success{
          background:rgba(34,197,94,0.12);
          border:1px solid rgba(34,197,94,0.35);
          color:#86efac;
          border-radius:10px;
          padding:10px 14px;
          font-size:13px;
          margin-bottom:16px;
      }

      .btn-verify{
          width:100%;
          padding:15px;
          border:none;
          border-radius:10px;
          font-family:inherit;
          font-size:15.5px;
          font-weight:700;
          color:#04150b;
          cursor:pointer;
          background:linear-gradient(90deg,#3b82f6 0%, #22c55e 100%);
          transition:filter .15s ease, transform .15s ease;
      }

      .btn-verify:hover{filter:brightness(1.08);}
      .btn-verify:active{transform:translateY(1px);}
      .btn-verify:disabled{opacity:0.6;cursor:not-allowed;}

      .back{
          text-align:center;
          font-size:13.5px;
          color:var(--text-1);
          margin-top:20px;
      }

      a.link{
          color:#4fa8ff;
          text-decoration:none;
          font-weight:500;
      }

      a.link:hover{text-decoration:underline;}
    </style>
  </head>

<body>

    <div class="card">
      <div class="icon-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      </div>

      <h1>Forgot Password?</h1>
      <p class="sub">กรอกอีเมลของคุณ เราจะส่งรหัสยืนยัน 6 หลักไปให้เพื่อตั้งรหัสผ่านใหม่</p>

      <div id="fpError" class="auth-error" style="display:none;"></div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="email" type="email" placeholder="Enter your email">
        </div>
      </div>

      <button class="btn-verify" id="sendBtn" onclick="handleSendReset()">Send Reset Code</button>

      <div class="back">
        นึกรหัสผ่านได้แล้ว? <a href="Login.html" class="link">Sign in</a>
      </div>
    </div>

    <script>
    function showError(msg){
      const el = document.getElementById('fpError');
      el.textContent = (typeof msg === 'string' && msg.trim() && msg.trim() !== '{}')
        ? msg
        : 'เกิดข้อผิดพลาดจากระบบ กรุณาลองใหม่อีกครั้ง (Supabase อาจกำลังมีปัญหาชั่วคราว)';
      el.style.display = 'block';
    }

    async function handleSendReset(){
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError('กรุณากรอกอีเมล');
        return;
      }

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่งรหัส...';

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

        if (error) {
          showError(error.message);
          return;
        }

        window.location.href = 'ResetPassword.html?email=' + encodeURIComponent(email);
      } catch (err) {
        showError(err && err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
      }
    }
    </script>

    </body>
    </html>
