<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AEC VERSE — Virtual Tour</title>
<link rel="icon" type="image/png" href="Logo.png">
<script src="page-transitions.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public-portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="public-portal.js"></script>
<script src="view-tabs.js"></script>
<link rel="stylesheet" href="ui-polish.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="portal-sidebar"></aside>

    <div class="page">
    <div class="topbar" id="portal-topbar"></div>

      <div class="page-content">

      <div class="sec">
        <div class="sec-head"><span class="sec-num">02</span><span class="sec-tag">VIRTUAL TOUR</span></div>
        <div class="sec-title">Virtual Factory Tour</div>
        <div class="sec-sub" style="margin-bottom:14px;">เดินสำรวจโรงงานผลิตก๊าซชีวภาพแบบ 3 มิติด้วยตัวละครของคุณเอง — ร่วมโลกเดียวกับผู้ใช้คนอื่นแบบเรียลไทม์</div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
          <div class="tabs" id="view-mode-tabs">
            <div class="tab active" data-view="third">3D View</div>
            <div class="tab" data-view="top">Top View</div>
            <div class="tab" data-view="first">First Person</div>
          </div>
          <span style="color:var(--text-2);font-size:11.5px;">เลือกมุมกล้อง — First Person คือมองผ่านสายตาตัวละคร</span>
        </div>

        <div class="card" style="padding:0;">
          <!-- allow="microphone; autoplay; fullscreen; xr-spatial-tracking" จำเป็น: ไม่มีแล้วเบราว์เซอร์จะบล็อกทั้ง
               การเปิดไมค์และการเล่นเสียงเพื่อนภายใน iframe (voice chat จะเงียบสนิท) -->
          <iframe id="tourFrame" title="Virtual Tour" loading="lazy"
            allow="microphone; autoplay; fullscreen; xr-spatial-tracking" allowfullscreen
            style="width:100%;height:84vh;min-height:620px;border:0;border-radius:12px;background:#080b11;display:block;"></iframe>
        </div>
      </div>

      </div>
    </div>
  </div>

<script>
renderPortalSidebar('PublicVirtualTour.html');
renderPortalTopbar('Virtual Tour', '(ทัวร์เสมือนจริง)');
initUserChip();
initPortalLiveFeed();
markTaskDone('virtualTourVisited');

// ส่งต่อ ?focus=<typeKey> จาก URL ของหน้านี้ (เช่น สแกน QR code) เข้าไปให้ index.html
// ในเฟรม เพื่อให้กล้อง/ตัวละครโฟกัสไปที่อุปกรณ์นั้นอัตโนมัติ
(function () {
  const focus = new URLSearchParams(location.search).get('focus');
  const frame = document.getElementById('tourFrame');
  // ผูกแท็บมุมกล้องก่อนตั้ง src เพื่อให้ทัน event 'load' ของเฟรม (ใช้ส่งโหมดที่ค้างไว้ซ้ำ)
  AecViewTabs.mount(document.getElementById('view-mode-tabs'), frame);
  frame.src = 'index.html' + (focus ? ('?focus=' + encodeURIComponent(focus)) : '');
})();
</script>
<script src="tour-host.js"></script>
<script src="notifications.js"></script>
</body>
</html>
