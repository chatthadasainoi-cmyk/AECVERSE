<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AEC VERSE — กำลังเข้าสู่ระบบ...</title>
<link rel="icon" type="image/png" href="Logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1200px 800px at 15% 10%, #0d1c2c 0%, #050b14 55%), #050b14;
    color:#a8b7c7;
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;font-size:13.5px;
    opacity:0; transition:opacity .35s ease;
  }
  body.ready{ opacity:1; }
  .box{ text-align:center; }

  .brand-mark{ width:56px;height:56px;object-fit:contain;margin:0 auto 18px auto;display:block; }
  @media (prefers-reduced-motion: no-preference){
    .brand-mark{ animation:pulseLogo 1.8s ease-in-out infinite; }
  }
  @keyframes pulseLogo{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.06); opacity:.85; } }

  .ring-wrap{ width:44px;height:44px;margin:0 auto 18px auto;position:relative; }
  .ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid #1c2c3f;border-top-color:#3b82f6;border-right-color:#22d3ee;
    animation:spin .85s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .msg{ font-size:13.5px; color:#a8b7c7; font-weight:500; }
  .sub{ font-size:11.5px; color:#54677b; margin-top:6px; }
</style>
<link rel="stylesheet" href="ui-polish.css">
</head>
<body>
  <div class="box">
    <img src="Logo.png" alt="" class="brand-mark">
    <div class="ring-wrap"><div class="ring"></div></div>
    <div class="msg">กำลังพาคุณไปยังหน้าที่เหมาะสม...</div>
    <div class="sub">AEC VERSE</div>
  </div>
<script>
// จุดตัดสินใจเดียวสำหรับทุก flow การล็อกอิน (email/password, OAuth, สมัครสมาชิก, รีเซ็ตรหัสผ่าน)
// เพื่อไม่ให้ logic เช็ค role ซ้ำกันหลายที่ — เช็คสิทธิ์แล้วพา:
//   admin        -> Dashboard.html (แอปแอดมินเดิม)
//   user ทั่วไป  -> PublicHome.html (พอร์ทัลผู้ใช้ใหม่)
// ยกเว้นมี ?next= แนบมา (เช่น สแกน QR code แล้วโดนเด้งมา login ก่อน) — พากลับไปหน้านั้นแทน

requestAnimationFrame(() => document.body.classList.add('ready'));

// ตรวจ next ให้เป็นแค่ "ชื่อไฟล์ .html ในโฟลเดอร์เดียวกัน + query" เท่านั้น กัน open-redirect
// (ห้ามเป็น URL เต็ม, ห้ามขึ้นต้นด้วย // หรือมี : เพราะนั่นคือพยายามชี้ออกนอกโดเมน)
function safeNextPath(raw){
  if (!raw) return null;
  if (!/^[A-Za-z0-9_-]+\.html(\?[^\s]*)?$/.test(raw)) return null;
  return raw;
}

function goTo(url){
  // fade ออกก่อนเปลี่ยนหน้าจริง ให้ต่อเนื่องกับ fade-in ของหน้าเป้าหมาย ไม่ใช่ตัดฉากทันที
  document.body.classList.remove('ready');
  setTimeout(() => { window.location.href = url; }, 220);
}

// ติดธงให้ brand-intro.js รู้ว่า "นี่คือการเข้าแอปรอบใหม่" จะได้เล่นอินโทรโลโก้ให้
// ทุกครั้งที่ล็อกอิน (ไม่ใช่แค่ครั้งเดียวต่อ session) — หน้าปลายทางจะลบธงทิ้งหลังเล่นจบ
// ยกเว้นกรณีถูกส่งกลับไปหน้า Login (ยังไม่ได้เข้าระบบจริง) จึงติดธงเฉพาะตอนเข้าแอปสำเร็จ
function markFreshEntry(){
  try { sessionStorage.setItem('aec_show_brand_intro', '1'); } catch (e) {}
}

(async function () {
  const next = safeNextPath(new URLSearchParams(location.search).get('next'));
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { goTo('Login.html'); return; }

    const res = await fetch('/api/me/role', { headers: { Authorization: 'Bearer ' + session.access_token } });
    const body = await res.json().catch(() => ({}));
    const isAdmin = res.ok && body.isAdmin;
    // next ใช้ได้เฉพาะฝั่ง user ทั่วไป (หน้า Public*) — admin ยังเข้าแอปแอดมินตามปกติเสมอ
    markFreshEntry();
    goTo(next && !isAdmin ? next : (isAdmin ? 'Dashboard.html' : 'PublicHome.html'));
  } catch (err) {
    // เช็ค role ไม่สำเร็จ (เช่น server ยังไม่พร้อม) -> ให้เข้าพอร์ทัลผู้ใช้ทั่วไปไว้ก่อน ปลอดภัยกว่าเดาเป็น admin
    markFreshEntry();
    goTo(next || 'PublicHome.html');
  }
})();
</script>
</body>
</html>
