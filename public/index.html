<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biogas Twin - Interactive Safety Metaverse</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>window.RAILWAY_SERVER_URL = "https://aecmultiplayer-production.up.railway.app";</script>
</head>
<body>

    <div id="viewer-shell">
        <div class="side-col" id="left-col">
            <div class="panel-section">
                <img src="logo.png" alt="Logo" style="width:100%; max-height:60px; object-fit:contain; margin-bottom:10px;">
                <h3>🌐 การเชื่อมต่อระบบ</h3>
                <div class="control-group">
                    <input type="text" id="input-player-name" placeholder="ระบุชื่อผู้ใช้งาน..." style="width:100%; padding:8px; background:#0f172a; border:1px solid #334155; color:white; border-radius:4px;">
                </div>
                <div id="connection-status" style="font-size:12px; color:#10b981; margin-top:5px;">🟢 กำลังเชื่อมต่อเซิร์ฟเวอร์...</div>
            </div>

            <div class="panel-section" style="flex:1; overflow-y:auto;">
                <h3>🏭 รายการชิ้นส่วนในระบบ 3D</h3>
                <div id="mesh-list-container" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>
        </div>

        <div id="center-col">
            <div id="canvas-container" style="width:100%; height:100%; position:relative;"></div>
        </div>

        <div class="side-col" id="right-col">
            <div class="panel-section" id="process-panel">
                <div id="title-container">
                    <h2 id="process-title" style="color:#00ffff; font-size:16px; margin:0 0 10px 0;">⚙️ ชิ้นส่วน: ยังไม่ได้เลือกวัตถุ</h2>
                </div>
                <div id="process-tag" class="tag tag-blue" style="margin-bottom:12px;">🌐 โครงสร้างทั่วไป</div>

                <div id="desc-view-area">
                    <p id="process-desc" style="font-size:13px; color:#94a3b8; line-height:1.6; margin-bottom:15px;">กรุณาคลิกเลือกวัตถุในฉาก 3D หรือเดิน Avatar เข้าไปใกล้ๆ เพื่อตรวจสอบข้อกำหนดความปลอดภัยจำเพาะ</p>
                </div>

                <div id="steps-view-area">
                    <h4 style="font-size:12px; color:#38bdf8; text-transform:uppercase; margin:0 0 8px 0; letter-spacing:0.5px;">🛡️ มาตรฐานความปลอดภัยประจำพื้นที่</h4>
                    <ul id="process-steps" style="padding-left:18px; margin:0; font-size:13px; line-height:1.7; color:#e2e8f0;">
                        <li>ไม่มีข้อกำหนดความปลอดภัยเพิ่มเติม</li>
                    </ul>
                </div>

                <div id="desc-edit-area" style="display: none; margin-bottom: 12px;">
                    <div style="margin-bottom: 10px;">
                        <label style="display:block; font-size:11px; color:#94a3b8; margin-bottom:4px; font-weight:bold;">🏷️ กำหนดประเภทชิ้นส่วนเฉพาะทาง (Specific Type):</label>
                        <select id="input-edit-type" style="background:#0f172a; color:#00ffff; border:1px solid #334155; padding: 8px; width:100%; border-radius:6px; cursor:pointer;">
                            <option value="default">🌐 โครงสร้างทั่วไป (Default)</option>
                            <option value="tank">🛢️ บ่อหมักก๊าซ (Digester Tank)</option>
                            <option value="manhole">🕳️ ช่องเปิดคนมุด / ประตูเปิด (Manhole)</option>
                            <option value="pvrv">🔒 วาล์วนิรภัยแรงดัน (PVRV Valve)</option>
                            <option value="pipe">➡ ระบบท่อส่งแก๊ส (Biogas Piping)</option>
                            <option value="flare">🔥 หอเผาก๊าซทิ้งฉุกเฉิน (Enclosed Flare)</option>
                            <option value="utilization">⚙️ เครื่องยนต์ปั่นไฟ (Genset Room)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 10px;">
                        <label style="display:block; font-size:11px; color:#94a3b8; margin-bottom:4px; font-weight:bold;">📝 มาตรฐานความปลอดภัย:</label>
                        <textarea id="input-edit-desc" style="width:100%; height:60px; background:#0f172a; color:white; border:1px solid #334155; border-radius:4px; padding:6px; box-sizing:border-box; font-family:inherit;"></textarea>
                    </div>
                </div>

                <div id="steps-edit-area" style="display: none; margin-bottom: 15px;">
                    <label style="display:block; font-size:11px; color:#94a3b8; margin-bottom:4px; font-weight:bold;">📋 ข้อปฏิบัติ (คั่นข้อความแต่ละข้อด้วยเครื่องหมายจุลภาค , ):</label>
                    <textarea id="input-edit-steps" style="width:100%; height:60px; background:#0f172a; color:white; border:1px solid #334155; border-radius:4px; padding:6px; box-sizing:border-box; font-family:inherit;"></textarea>
                </div>

                <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.06); padding-top:12px;">
                    <button id="btn-edit-mode" style="width:100%; padding:8px; background:#3b82f6; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">✏️ แก้ไขข้อมูลชิ้นส่วน</button>
                    <div id="edit-actions-group" style="display:none; gap:8px;">
                        <button id="btn-save-edit" style="flex:1; padding:8px; background:#10b981; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">💾 บันทึกข้อมูล</button>
                        <button id="btn-cancel-edit" style="flex:1; padding:8px; background:#64748b; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">❌ ยกเลิก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
