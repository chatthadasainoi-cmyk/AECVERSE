<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biogas Twin Multiplayer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        #workflow-panel {
            position: absolute; top: 20px; right: 20px; width: 320px;
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 10; display: none;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .btn-save { background: #4d96ff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        #presenting-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 10; display: none;
        }
        #meta-container { position: absolute; bottom: 20px; left: 20px; z-index: 10; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; max-width: 300px; }
        #chat-logs { height: 150px; overflow-y: auto; font-size: 12px; margin-bottom: 5px; border-bottom: 1px solid #ddd; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="presenting-status">กำลังดูการนำเสนอชิ้นส่วน...</div>
    <div id="canvas-container"></div>

    <div id="workflow-panel">
        <h3 id="panel-title">รายละเอียดชิ้นส่วน</h3>
        <input type="hidden" id="component-key">
        <div class="form-group">
            <label>ชื่อชิ้นส่วน / ขั้นตอน</label>
            <input type="text" id="component-name">
        </div>
        <div class="form-group">
            <label>คำอธิบายรายละเอียด</label>
            <textarea id="component-desc" rows="4"></textarea>
        </div>
        <button class="btn-save" onclick="saveWorkflow()">บันทึกและแชร์ข้อมูล</button>
        <button style="margin-top:5px; background:#aaa; width:100%; border:none; color:white; padding:5px; border-radius:6px; cursor:pointer;" onclick="closePanel()">ปิด</button>
    </div>

    <div id="meta-container">
        <div id="player-name-tag">คุณคือ: กำลังเชื่อมต่อ...</div>
        <div id="chat-logs"></div>
        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความแชท..." onkeydown="if(event.key==='Enter') sendChat()">
    </div>

    <script>
        const socket = io();
        let localWorkflowDb = {};
        let myId = null;

        // พื้นฐาน Three.js (เปลี่ยนเป็นตัวโหลดโมเดลจริงของคุณได้เลย)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene(); scene.background = new THREE.Color('#f0f0f0');
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        camera.position.set(0, 3, 10);

        const parts = [];
        function createPart(name, color, x, key) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color }));
            mesh.position.set(x, 1, 0); mesh.userData = { key, defaultColor: color };
            scene.add(mesh); parts.push(mesh);
        }
        createPart("Digester", "#6bcb77", -2, "part_digester");
        createPart("Gas Holder", "#4d96ff", 2, "part_gasholder");

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();

        // ตรวจจับการคลิกพรีเซนต์
        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
            if(e.target.closest('#workflow-panel') || e.target.closest('#meta-container')) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(parts);
            if(intersects.length > 0) {
                const key = intersects[0].object.userData.key;
                openWorkflowPanel(key);
                socket.emit('component_select', { key, playerId: myId });
            }
        });

        function openWorkflowPanel(key) {
            document.getElementById('workflow-panel').style.display = 'block';
            document.getElementById('component-key').value = key;
            if(localWorkflowDb[key]) {
                document.getElementById('component-name').value = localWorkflowDb[key].name || '';
                document.getElementById('component-desc').value = localWorkflowDb[key].desc || '';
                document.getElementById('panel-title').innerText = `ชิ้นส่วน: ${localWorkflowDb[key].name}`;
            } else {
                document.getElementById('component-name').value = '';
                document.getElementById('component-desc').value = '';
                document.getElementById('panel-title').innerText = `แก้ไขชิ้นส่วน (${key})`;
            }
        }

        function closePanel() { document.getElementById('workflow-panel').style.display = 'none'; }

        function saveWorkflow() {
            const key = document.getElementById('component-key').value;
            const name = document.getElementById('component-name').value;
            const desc = document.getElementById('component-desc').value;
            if(!name) return alert('กรุณากรอกชื่อ');
            socket.emit('workflow_update', { key, name, desc, steps: [], colorClass: 'tag-blue' });
        }

        // ฟังคำสั่ง Real-time จากเซิร์ฟเวอร์
        socket.on('self_init', (data) => {
            myId = data.self.id;
            document.getElementById('player-name-tag').innerText = `คุณคือ: ${data.self.name}`;
            document.getElementById('player-name-tag').style.color = data.self.color;
            localWorkflowDb = data.workflowDb || {};
        });

        socket.on('workflow_updated', (data) => {
            localWorkflowDb[data.key] = { name: data.name, desc: data.desc, steps: data.steps, colorClass: data.colorClass };
            if(document.getElementById('component-key').value === data.key && document.getElementById('workflow-panel').style.display === 'block') {
                openWorkflowPanel(data.key);
            }
        });

        socket.on('component_selected', (data) => {
            const statusTag = document.getElementById('presenting-status');
            statusTag.style.display = 'block';
            statusTag.innerText = `เพื่อนกำลังพรีเซนต์ชิ้นส่วน: ${data.key}`;
            openWorkflowPanel(data.key);
            setTimeout(() => { statusTag.style.display = 'none'; }, 4000);
        });

        function sendChat() {
            const input = document.getElementById('chat-input'); if(!input.value.trim()) return;
            socket.emit('chat_message', input.value); input.value = '';
        }
        socket.on('chat_message', (data) => {
            document.getElementById('chat-logs').innerHTML += `<div><strong style="color:${data.color}">${data.name}:</strong> ${data.text}</div>`;
        });
    </script>
</body>
</html>
