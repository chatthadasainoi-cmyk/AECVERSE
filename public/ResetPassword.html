<!DOCTYPE html>
  <html lang="th">
  <head>
    <meta charset="UTF-8">
    <title>AEC VERSE — Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <style>
      :root{
          --bg-0:#050b14;
          --bg-1:#0a1420;
          --panel:#0c1826;
          --panel-border:#1c2c3f;
          --field-bg:#0e1b29;
          --field-border:#243347;
          --text-0:#f4f8fb;
          --text-1:#a8b7c7;
          --text-2:#6d7f92;
          --accent-green:#4ade80;
          --accent-blue:#3b82f6;
          --accent-cyan:#22d3ee;
          --danger:#ef4444;
      }

      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
          background:radial-gradient(1200px 800px at 15% 10%, #0d1c2c 0%, var(--bg-0) 55%), var(--bg-0);
          color:var(--text-0);
          font-family:"Inter",system-ui,sans-serif;
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:28px;
      }

      .card{
          width:100%;
          max-width:460px;
          background:linear-gradient(180deg, #0d1c2c 0%, #0a1520 100%);
          border:1px solid #16283b;
          border-radius:16px;
          padding:48px 40px;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      }

      .icon-wrap{
          width:56px;height:56px;
          border-radius:14px;
          background:rgba(34,211,238,0.12);
          color:var(--accent-cyan);
          display:flex;align-items:center;justify-content:center;
          margin-bottom:20px;
      }

      h1{
          font-family:"Sora",sans-serif;
          font-size:26px;
          font-weight:700;
          margin:0 0 8px 0;
      }

      p.sub{
          margin:0 0 8px 0;
          color:var(--text-1);
          font-size:14px;
          line-height:1.6;
      }

      p.sub .email{
          color:var(--text-0);
          font-weight:600;
      }

      .field{
          margin:24px 0 20px 0;
      }

      .field label{
          display:block;
          font-size:13px;
          font-weight:600;
          color:var(--text-1);
          margin-bottom:8px;
      }

      .field .input-wrap{
          position:relative;
          display:flex;
          align-items:center;
      }

      .field .input-wrap svg.icon-left{
          position:absolute;
          left:16px;
          color:var(--text-2);
          pointer-events:none;
      }

      .field input{
          width:100%;
          background:var(--field-bg);
          border:1px solid var(--field-border);
          border-radius:10px;
          padding:14px 16px 14px 46px;
          color:var(--text-0);
          font-size:14.5px;
          font-family:inherit;
          outline:none;
          transition:border-color .15s ease, box-shadow .15s ease;
      }

      .field input::placeholder{color:#54677b;}
      .field input:focus{
          border-color:var(--accent-cyan);
          box-shadow:0 0 0 3px rgba(34,211,238,0.12);
      }

      .field .toggle-eye{
          position:absolute;
          right:16px;
          color:var(--text-2);
          cursor:pointer;
          background:none;
          border:none;
          padding:2px;
          display:flex;
      }

      .field .toggle-eye:hover{color:var(--text-1);}

      #otpInput{
          width:100%;
          background:var(--field-bg);
          border:1px solid var(--field-border);
          border-radius:10px;
          padding:16px;
          color:var(--text-0);
          font-size:24px;
          font-weight:700;
          font-family:"Sora",monospace;
          letter-spacing:10px;
          text-align:center;
          outline:none;
          transition:border-color .15s ease, box-shadow .15s ease;
      }

      #otpInput::placeholder{color:#54677b;letter-spacing:10px;}
      #otpInput:focus{
          border-color:var(--accent-cyan);
          box-shadow:0 0 0 3px rgba(34,211,238,0.12);
      }

      .auth-error{
          background:rgba(239,68,68,0.12);
          border:1px solid rgba(239,68,68,0.35);
          color:#fca5a5;
          border-radius:10px;
          padding:10px 14px;
          font-size:13px;
          margin-bottom:16px;
      }

      .auth-success{
          background:rgba(34,197,94,0.12);
          border:1px solid rgba(34,197,94,0.35);
          color:#86efac;
          border-radius:10px;
          padding:10px 14px;
          font-size:13px;
          margin-bottom:16px;
      }

      .btn-verify{
          width:100%;
          padding:15px;
          border:none;
          border-radius:10px;
          font-family:inherit;
          font-size:15.5px;
          font-weight:700;
          color:#04150b;
          cursor:pointer;
          background:linear-gradient(90deg,#3b82f6 0%, #22c55e 100%);
          transition:filter .15s ease, transform .15s ease;
      }

      .btn-verify:hover{filter:brightness(1.08);}
      .btn-verify:active{transform:translateY(1px);}
      .btn-verify:disabled{opacity:0.6;cursor:not-allowed;}

      .resend{
          text-align:center;
          font-size:13.5px;
          color:var(--text-1);
          margin-top:20px;
      }

      a.link{
          color:#4fa8ff;
          text-decoration:none;
          font-weight:500;
          background:none;
          border:none;
          cursor:pointer;
          font-family:inherit;
          font-size:inherit;
      }

      a.link:hover{text-decoration:underline;}
      a.link:disabled{color:var(--text-2);cursor:not-allowed;text-decoration:none;}

      .hidden{display:none;}
    </style>
  </head>

<body>

    <div class="card">
      <div class="icon-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </div>

      <!-- STEP 1: enter OTP -->
      <div id="stepOtp">
        <h1>Enter Reset Code</h1>
        <p class="sub">เราได้ส่งรหัสยืนยัน 6 หลักไปที่ <span class="email" id="emailDisplay">-</span><br>กรุณากรอกรหัสเพื่อดำเนินการต่อ</p>

        <div id="otpError" class="auth-error" style="display:none;"></div>

        <div class="field">
          <label for="otpInput">รหัสยืนยัน (OTP)</label>
          <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
        </div>

        <button class="btn-verify" id="verifyBtn" onclick="handleVerify()">Verify Code</button>

        <div class="resend">
          ไม่ได้รับรหัส? <button class="link" id="resendBtn" onclick="handleResend()">ส่งรหัสอีกครั้ง</button>
        </div>
      </div>

      <!-- STEP 2: set new password -->
      <div id="stepPassword" class="hidden">
        <h1>Set New Password</h1>
        <p class="sub">ตั้งรหัสผ่านใหม่สำหรับบัญชี <span class="email" id="emailDisplay2">-</span></p>

        <div id="pwError" class="auth-error" style="display:none;"></div>
        <div id="pwSuccess" class="auth-success" style="display:none;"></div>

        <div class="field">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <input id="newPassword" type="password" placeholder="Enter new password (min. 6 characters)">
            <button class="toggle-eye" type="button" onclick="togglePwd('newPassword')" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmNewPassword">Confirm New Password</label>
          <div class="input-wrap">
            <svg class="icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <input id="confirmNewPassword" type="password" placeholder="Re-enter new password">
            <button class="toggle-eye" type="button" onclick="togglePwd('confirmNewPassword')" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-verify" id="updateBtn" onclick="handleUpdatePassword()">Update Password</button>
      </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    document.getElementById('emailDisplay').textContent = email || '(ไม่พบอีเมล)';
    document.getElementById('emailDisplay2').textContent = email || '(ไม่พบอีเมล)';

    function togglePwd(id){
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showOtpError(msg){
      const el = document.getElementById('otpError');
      el.textContent = (typeof msg === 'string' && msg.trim() && msg.trim() !== '{}')
        ? msg
        : 'เกิดข้อผิดพลาดจากระบบ กรุณาลองใหม่อีกครั้ง (Supabase อาจกำลังมีปัญหาชั่วคราว)';
      el.style.display = 'block';
    }

    function showPwError(msg){
      document.getElementById('pwSuccess').style.display = 'none';
      const el = document.getElementById('pwError');
      el.textContent = (typeof msg === 'string' && msg.trim() && msg.trim() !== '{}')
        ? msg
        : 'เกิดข้อผิดพลาดจากระบบ กรุณาลองใหม่อีกครั้ง (Supabase อาจกำลังมีปัญหาชั่วคราว)';
      el.style.display = 'block';
    }

    async function handleVerify(){
      const token = document.getElementById('otpInput').value.trim();
      if (!email) {
        showOtpError('ไม่พบอีเมล กรุณากลับไปหน้า Forgot Password ใหม่');
        return;
      }
      if (!token || token.length !== 6) {
        showOtpError('กรุณากรอกรหัสยืนยัน 6 หลัก');
        return;
      }

      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังยืนยัน...';

      try {
        const { error } = await supabaseClient.auth.verifyOtp({ email, token, type: 'recovery' });

        if (error) {
          showOtpError(error.message);
          return;
        }

        document.getElementById('stepOtp').classList.add('hidden');
        document.getElementById('stepPassword').classList.remove('hidden');
      } catch (err) {
        showOtpError(err && err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify Code';
      }
    }

    async function handleResend(){
      if (!email) {
        showOtpError('ไม่พบอีเมล กรุณากลับไปหน้า Forgot Password ใหม่');
        return;
      }
      const btn = document.getElementById('resendBtn');
      btn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
        if (error) showOtpError(error.message);
      } catch (err) {
        showOtpError(err && err.message);
      }

      setTimeout(() => { btn.disabled = false; }, 15000);
    }

    async function handleUpdatePassword(){
      const pwd = document.getElementById('newPassword').value;
      const confirmPwd = document.getElementById('confirmNewPassword').value;

      if (!pwd || !confirmPwd) {
        showPwError('กรุณากรอกรหัสผ่านให้ครบทุกช่อง');
        return;
      }
      if (pwd.length < 6) {
        showPwError('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
        return;
      }
      if (pwd !== confirmPwd) {
        showPwError('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');
        return;
      }

      const btn = document.getElementById('updateBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: pwd });

        if (error) {
          showPwError(error.message);
          return;
        }

        document.getElementById('pwSuccess').textContent = 'ตั้งรหัสผ่านใหม่สำเร็จ! กำลังพาไปหน้า Metaverse...';
        document.getElementById('pwSuccess').style.display = 'block';
        document.getElementById('pwError').style.display = 'none';
        setTimeout(() => { window.location.href = 'Dashboard.html'; }, 1200);
      } catch (err) {
        showPwError(err && err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
    </script>

    </body>
    </html>
